# 环境 · 凭证 · 租户 · 命名约定 模板
#
# 用法：复制本文件为 config/env.local.yaml 后填入真实值。
#   Windows PowerShell:  Copy-Item config/env.example.yaml config/env.local.yaml
#   macOS / Linux:       cp config/env.example.yaml config/env.local.yaml
#
# env.local.yaml 已被 .gitignore 忽略，禁止提交。本模板只允许出现占位符。

default_env: sit

# ---------------------------------------------------------------------------
# 环境
# ---------------------------------------------------------------------------
environments:
  sit:
    display_name: SIT
    base_url: "<sit-base-url>"
    login_method: email_otp          # email_otp | password
    otp_universal: "<万能验证码>"      # 若环境提供固定验证码
    otp_scope: "<适用范围>"            # 任意邮箱 / 仅白名单账号 —— 决定能否自助批量建号
    notes: "<用途说明>"
  uat:
    display_name: UAT
    base_url: "<uat-base-url>"
    login_method: email_otp
    otp_universal: "<万能验证码>"
    otp_scope: "<适用范围>"
    notes: "<用途说明>"

# ---------------------------------------------------------------------------
# 高权限账号
# 说明：执行用的普通账号请在对应 Sprint 的 data-ledger.md 维护，此处只放长期凭证。
# ---------------------------------------------------------------------------
accounts:
  super_admin:
    email: "<email>"
    tenant: t1
    roles: ["System Admin"]
    capabilities:
      - delete_account          # 删除用户 / Confirm Action 批量转移
      - edit_role_permission    # Role 权限树配置（OTA / Vulnerability Tab）
      - create_resource         # 建号、建 Key / Cert / Factory / Product
    notes: "<用途与有效期>"

# ---------------------------------------------------------------------------
# 租户
# t1 / t2 为代号，含义见 config/conventions.md
# ---------------------------------------------------------------------------
tenants:
  t1:
    display_name: "<租户显示名>"
    short_name: "<Audit Organization 列显示的租户简称>"
    ota_vulnerability: enabled       # 会上线 OTA & Vulnerability
    roles_to_verify:
      - "雪球超级管理员"
      - "雪球租户数据管理员"
      - "System Manager"
      - "Product Manager"
    notes: "<主测试租户>"
  t2:
    display_name: "<不上线租户显示名>"
    short_name: "<简称>"
    ota_vulnerability: disabled      # 所有 Role 均不配置两项权限
    notes: "<对照租户>"
  t3:
    display_name: "<第二 Organization 来源>"
    short_name: "<简称>"
    purpose: audit_organization_filter
    notes: "<用于 Audit Organization 列与筛选；跨租户日志可行性待确认>"

# ---------------------------------------------------------------------------
# Figma
# ---------------------------------------------------------------------------
figma:
  ux_p2_detail_supplement:
    url: "<完整 figma 链接>"
    file_key: "<fileKey>"
    nodes:
      checkbox_theme_color: "15959-188662"   # 勾选框主题色对照

# ---------------------------------------------------------------------------
# 造数命名与清理约定（可读版见 config/conventions.md）
# ---------------------------------------------------------------------------
naming:
  prefix: "<sprint 前缀，如 qa0807->"
  account_email: "<如 qa0807-{purpose}@example.com>"
  resource: "<如 qa0807-{module}-{seq}>"
  cleanup: "Sprint 结束后按前缀清理；已删除账号不可回收"
